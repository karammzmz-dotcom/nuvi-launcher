name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Gradle project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found in repo"; ls -R | head -50; exit 1; fi
          d=$(dirname "$f")
          echo "Project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled on runner; accept licenses)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper (gradlew + wrapper jar)
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle wrapper --gradle-version 8.5

      - name: Make gradlew executable
        working-directory: ${{ steps.find.outputs.dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvi-launcher-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
